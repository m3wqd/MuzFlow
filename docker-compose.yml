services:
  backend:
    build: ./backend
    container_name: muzflow-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./storage:/storage

    environment:
      DATABASE_URL: postgresql+psycopg://mymusic:mymusic_password@postgres:5432/mymusic

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: muzflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mymusic
      POSTGRES_USER: mymusic
      POSTGRES_PASSWORD: mymusic_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymusic -d mymusic"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: muzflow-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data: